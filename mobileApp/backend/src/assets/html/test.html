<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetTrackerAI API</title>
    <style>
        :root {
            --primary: #0071e3;
            --primary-gradient: linear-gradient(135deg, #0071e3 0%, #56CCF2 100%);
            --secondary: #6c63ff;
            --background: #0a0b1a;
            --card-bg: rgba(16, 18, 35, 0.85);
            --text: #ffffff;
            --subtle-text: #a2a3b9;
            --shadow: 0 8px 32px rgba(0, 113, 227, 0.25);
            --border-radius: 28px;
            --glow: 0 0 15px rgba(0, 113, 227, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'SF Pro Display', 'Segoe UI', sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: -0.022em;
            background-image:
                    radial-gradient(circle at 20% 30%, rgba(108, 99, 255, 0.2) 0%, transparent 30%),
                    radial-gradient(circle at 80% 70%, rgba(0, 113, 227, 0.2) 0%, transparent 30%);
            overflow-x: hidden;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            padding: 50px 40px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: calc(var(--border-radius) + 5px);
            background: var(--primary-gradient);
            z-index: -1;
            opacity: 0.3;
            filter: blur(15px);
        }

        .logo-container {
            margin-bottom: 35px;
            position: relative;
            display: inline-block;
        }

        .logo-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--border-radius);
            background: var(--primary-gradient);
            opacity: 0.3;
            filter: blur(15px);
            z-index: -1;
        }

        .logo-container img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .logo-container img:hover {
            transform: scale(1.05);
            box-shadow: var(--glow), 0 10px 30px rgba(0, 113, 227, 0.4);
        }

        h1 {
            font-size: clamp(40px, 8vw, 56px);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 4px;
            background: var(--primary-gradient);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
        }

        p {
            font-size: 21px;
            color: var(--subtle-text);
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px 34px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 113, 227, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent
            );
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: var(--subtle-text);
        }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(58, 220, 159, 0.15);
            color: #3adc9f;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #3adc9f;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .glow-effect {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
        }

        .glow-1 {
            top: 10%;
            left: 15%;
            background: var(--primary);
        }

        .glow-2 {
            bottom: 10%;
            right: 15%;
            background: var(--secondary);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(58, 220, 159, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(58, 220, 159, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(58, 220, 159, 0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            .logo-container img {
                width: 150px;
                height: 150px;
            }

            h1 {
                font-size: 40px;
            }

            p {
                font-size: 18px;
            }

            .btn {
                padding: 14px 28px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .logo-container img {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
                margin-bottom: 30px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 15px;
            }

            .status-badge {
                top: 15px;
                right: 15px;
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
<div class="glow-effect glow-1"></div>
<div class="glow-effect glow-2"></div>

<div class="container">
    <div class="status-badge">API Online</div>

    <div class="logo-container">
        <img src="/assets/icon.png" alt="BudgetTrackerAI Logo">
    </div>

    <h1>BudgetTrackerAI</h1>
    <p>Ihre API läuft erfolgreich. Bereit, Ihre Finanzdaten in wertvolle Erkenntnisse zu verwandeln.</p>

    <button class="btn" onclick="location.href='/assets/html/test-api.html'">
        API-Schnittstelle testen
    </button>
</div>

<div class="footer">
    BudgetTrackerAI © 2025
</div>
</body>
</html>
